<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBKR Delayed Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background-color: #1c1c1e; color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; }
    #chart-wrapper { flex: 1; padding: 1rem; display: flex; flex-direction: column; min-height: 0; }
    h1 { color: #f0f0f0; text-align: center; margin: 0; padding-bottom: 1rem; font-size: 1.5rem; font-weight: 500; flex-shrink: 0; }
    #chart-container { flex-grow: 1; width: 100%; height: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="chart-wrapper">
    <h1 id="chart-title">Loading Chart...</h1>
    <div id="chart-container"></div>
  </div>

  <script>
    window.onload = async function() {
      if (typeof LightweightCharts === 'undefined') {
        document.getElementById('chart-container').innerHTML = "<h2 style='color:yellow; text-align:center;'>❌ ERROR: Lightweight Charts library failed to load.</h2>";
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const conid = urlParams.get('conid');
      const chartContainer = document.getElementById('chart-container');
      const chartTitle = document.getElementById('chart-title');

      if (!conid) {
        chartTitle.textContent = '❌ Error: No conid specified in URL.';
        return;
      }

      chartTitle.textContent = `Loading Chart for Conid: ${conid}...`;

      const chart = LightweightCharts.createChart(chartContainer, {
        layout: { background: { color: '#1c1c1e' }, textColor: '#DDD' },
        grid: { vertLines: { color: '#444' }, horzLines: { color: '#444' } },
        timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#555' },
        rightPriceScale: { borderColor: '#555' },
        watermark: { visible: true, fontSize: 24, horzAlign: 'center', vertAlign: 'center', color: 'rgba(255,255,255,0.15)', text: 'DELAYED DATA' }
      });

      const resizeObserver = new ResizeObserver(entries => {
        for (const entry of entries) {
          const { width, height } = entry.contentRect;
          chart.applyOptions({ width, height });
        }
      });
      resizeObserver.observe(chartContainer);

      try {
        const response = await fetch('/api/marketdata/' + conid);
        if (!response.ok) {
          throw new Error('Failed to fetch data: ' + response.status + ' ' + response.statusText);
        }

        const data = await response.json();
        chartTitle.textContent = 'Delayed Chart for ' + (data.symbol || ('Conid ' + conid));
        chart.applyOptions({ watermark: { text: (data.symbol || ('Conid ' + conid)) + ' (DELAYED DATA)' } });

        const candleSeries = chart.addCandlestickSeries({
          upColor: '#26a69a',
          downColor: '#ef5350',
          borderDownColor: '#ef5350',
          borderUpColor: '#26a69a',
          wickDownColor: '#ef5350',
          wickUpColor: '#26a69a'
        });

        const seriesData = (data.marketData || []).map(d => ({
          time: Math.floor(d.t / 1000),
          open: d.o,
          high: d.h,
          low: d.l,
          close: d.c
        }));

        candleSeries.setData(seriesData);
        chart.timeScale().fitContent();
      } catch (error) {
        console.error('Error loading chart data:', error);
        chartTitle.textContent = '❌ Error loading chart for Conid: ' + conid;
        chartContainer.innerHTML = '<p style="color:red; text-align:center;">' + (error.message || 'Unknown error') + '</p>';
      }
    };
  </script>
</body>
</html>
